version: 1
widgets:
  cal-wasteschedule3:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: f7-card
    config:
      stylesheet: |
        .icon {
          width: 18px !important;
          height: 18px !important;
          font-size: 18px !important;
        }
    slots:
      default:
        - component: f7-card-content
          slots:
            default:
              - component: f7-list
                config:
                  mediaList: true
                slots:
                  default:
                    - component: oh-list-item
                      config:
                        badge: '=((dayjs(items.AbfallAbholung0_Start.state).diff(dayjs().startOf("day"), "days")) == 0 ? "Heute" : (dayjs(items.AbfallAbholung0_Start.state).diff(dayjs().startOf("day"), "days")) == 1 ? "Morgen" : false)'
                        badgeColor: '=((dayjs(items.AbfallAbholung0_Start.state).diff(dayjs().startOf("day"), "days")) == 0 ? "red" : "yellow")'
                        icon: f7:trash
                        iconColor: '=( items.AbfallAbholung0_Titel.state.match( "Altpapier" ) ? "green" : ( items.AbfallAbholung0_Titel.state.match( "Bio" ) ? "deeporange" : ( items.AbfallAbholung0_Titel.state.match( "Rest" ) ? "gray" : ( items.AbfallAbholung0_Titel.state.match( "Gelb" ) ? "yellow" : "white" ))))'
                        title: =dayjs(items.AbfallAbholung0_Start.state).format("DD. MMM") + " - " + items.AbfallAbholung0_Titel.state
                        visible: '=items.AbfallAbholung0_Start.state == "UNDEF" ? false : true'
