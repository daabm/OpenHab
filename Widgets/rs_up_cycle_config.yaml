version: 1
widgets:
  rs-up-cycle-config:
    tags:
      - rollershutter
      - config
    props:
      parameters:
        - context: item
          description: Base rollershutter floor group, for example RSEG, RSOG1, RSOG2
          label: Rollershutter floor group
          name: group
          required: true
          type: TEXT
        - description: Optional widget title
          label: Title
          name: title
          required: false
          type: TEXT
        - context: item
          description: Rollershutter item used to detect manual re-closing
          label: Reference item
          name: referenceItem
          required: false
          type: TEXT
      parameterGroups: []
    component: oh-list-card
    config:
      title: "=props.title ? props.title : props.group + ' Öffnungszyklus'"
    slots:
      default:
        - component: oh-toggle-item
          config:
            title: Öffnungszyklus aktiv
            subtitle: =props.group + '_UpCycleEnabled'
            item: =props.group + '_UpCycleEnabled'
        - component: oh-list-item
          config:
            title: Öffnungszyklus manuell auslösen
            subtitle: "='Send manual trigger: ' + props.group"
            footer: Startet den Öffnungszyklus sofort und ignoriert die konfigurierte Startzeit
            icon: f7:play_circle
            action: command
            actionItem: RS_UpCycleManualTrigger
            actionCommand: =props.group
            visible: =!!props.group
        - component: oh-input-item
          config:
            title: Startzeit Werktag
            subtitle: Montag bis Freitag, Format HH:mm
            item: =props.group + '_UpCycleStartTimeWeekday'
            type: time
            sendButton: true
            clearButton: true
            placeholder: 07:00
        - component: oh-input-item
          config:
            title: Startzeit Samstag
            subtitle: Format HH:mm
            item: =props.group + '_UpCycleStartTimeSaturday'
            type: time
            sendButton: true
            clearButton: true
            placeholder: 09:00
        - component: oh-input-item
          config:
            title: Startzeit Sonntag
            subtitle: Format HH:mm
            item: =props.group + '_UpCycleStartTimeSunday'
            type: time
            sendButton: true
            clearButton: true
            placeholder: 09:30
        - component: oh-input-item
          config:
            title: Startzeit Feiertag
            subtitle: Feiertag hat Vorrang vor Wochentag/Samstag/Sonntag
            item: =props.group + '_UpCycleStartTimeHoliday'
            type: time
            sendButton: true
            clearButton: true
            placeholder: 09:30
        - component: oh-stepper-item
          config:
            title: Dauer
            subtitle: Gesamtdauer des Öffnungszyklus in Minuten
            item: =props.group + '_UpCycleTime'
            min: 0
            max: 240
            step: 5
            autorepeat: true
            autorepeatDynamic: false
        - component: oh-stepper-item
          config:
            title: Schritte
            subtitle: Anzahl der Öffnungsschritte
            item: =props.group + '_UpCycleSteps'
            min: 1
            max: 30
            step: 1
            autorepeat: true
            autorepeatDynamic: false
        - component: oh-list-item
          config:
            title: Referenz Item
            subtitle: "='Selected in widget config: ' + (props.referenceItem || 'not selected')"
            after: "=items[props.group + '_UpCycleReferenceItem'] ? items[props.group + '_UpCycleReferenceItem'].state : '-'"
            footer: Tap to apply the selected widget reference item
            action: command
            actionItem: =props.group + '_UpCycleReferenceItem'
            actionCommand: =props.referenceItem
            visible: =!!props.referenceItem
        - component: oh-list-item
          config:
            title: Referenz Item
            subtitle: Not selected in widget config
            after: "=items[props.group + '_UpCycleReferenceItem'] ? items[props.group + '_UpCycleReferenceItem'].state : '-'"
            visible: =!props.referenceItem
        - component: oh-stepper-item
          config:
            title: Referenztoleranz
            subtitle: Toleranz für manuelles Wiederschließen in Prozentpunkten
            item: =props.group + '_UpCycleReferenceTolerance'
            min: 0
            max: 50
            step: 1
            autorepeat: true
            autorepeatDynamic: false
        - component: oh-list-item
          config:
            title: Aktive Konfiguration
            subtitle: =props.group
            after: "=items[props.group + '_UpCycleEnabled'] ? items[props.group + '_UpCycleEnabled'].state : '-'"
        - component: oh-list-item
          config:
            title: Werktag
            after: "=items[props.group + '_UpCycleStartTimeWeekday'] ? items[props.group + '_UpCycleStartTimeWeekday'].state : '-'"
        - component: oh-list-item
          config:
            title: Samstag
            after: "=items[props.group + '_UpCycleStartTimeSaturday'] ? items[props.group + '_UpCycleStartTimeSaturday'].state : '-'"
        - component: oh-list-item
          config:
            title: Sonntag
            after: "=items[props.group + '_UpCycleStartTimeSunday'] ? items[props.group + '_UpCycleStartTimeSunday'].state : '-'"
        - component: oh-list-item
          config:
            title: Feiertag
            after: "=items[props.group + '_UpCycleStartTimeHoliday'] ? items[props.group + '_UpCycleStartTimeHoliday'].state : '-'"
        - component: oh-list-item
          config:
            title: Referenz
            after: "=items[props.group + '_UpCycleReferenceItem'] ? items[props.group + '_UpCycleReferenceItem'].state : '-'"
